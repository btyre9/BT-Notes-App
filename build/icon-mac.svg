<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Vizual Notes for the Mac: three blocks joined by a flowing line, with an arrow out of the
       last, in white on a colored rounded square. Apple's icon grid: an 824-point rounded square,
       100 points in, with a soft shadow. The colors are the two gradient stops below. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#7c83ff" />
      <stop offset="1" stop-color="#5b2fd6" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3" />
    </filter>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e0b5c" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" />
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)" />

  <!-- The flow, drawn on a 512 grid and scaled into the middle of the tile -->
  <g transform="translate(232 232) scale(1.09375)" filter="url(#lift)">
    <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M184 106 H336 Q406 106 406 176" />
      <path d="M328 254 H176 Q106 254 106 324" />
      <path d="M184 406 H318" />
      <path d="M274 362 L322 406 L274 450" />
    </g>
    <g fill="#ffffff">
      <rect x="28" y="28" width="156" height="156" rx="50" />
      <rect x="328" y="176" width="156" height="156" rx="50" />
      <rect x="28" y="328" width="156" height="156" rx="50" />
    </g>
  </g>
</svg>
