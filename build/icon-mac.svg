<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- BT Notes for the Mac: a small board (a wall of cards, a photo, a folder, an arrow) on a dark
       canvas, on Apple's icon grid: an 824-point rounded square, 100 points in, with a soft shadow. -->
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4d" />
      <stop offset="1" stop-color="#1f222b" />
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a6b" />
      <stop offset="0.55" stop-color="#e5484d" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f93ff" />
      <stop offset="1" stop-color="#2f6fe4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32" />
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <pattern id="dots" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="32" cy="32" r="5" fill="#ffffff" opacity="0.08" />
    </pattern>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185" /></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#canvas)" />
  </g>

  <g clip-path="url(#tile)">
    <!-- An even dot grid on the canvas, like the app's Dots pattern -->
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)" />

    <!-- The wall: a white panel with a colored bar and two cards -->
    <g filter="url(#lift)">
      <rect x="190" y="230" width="280" height="560" rx="44" fill="#ffffff" />
    </g>
    <rect x="226" y="270" width="12" height="44" rx="6" fill="#e5484d" />
    <rect x="256" y="278" width="140" height="28" rx="14" fill="#2b2f3a" opacity="0.85" />
    <rect x="222" y="346" width="216" height="170" rx="26" fill="#eef0f4" />
    <rect x="250" y="380" width="140" height="22" rx="11" fill="#9aa1ae" />
    <rect x="250" y="420" width="160" height="18" rx="9" fill="#c4c9d2" />
    <rect x="250" y="452" width="110" height="18" rx="9" fill="#c4c9d2" />
    <rect x="222" y="540" width="216" height="214" rx="26" fill="#eef0f4" />
    <rect x="250" y="574" width="112" height="22" rx="11" fill="#9aa1ae" />
    <circle cx="264" cy="640" r="13" fill="#c4c9d2" /><rect x="290" y="630" width="120" height="18" rx="9" fill="#c4c9d2" />
    <circle cx="264" cy="690" r="13" fill="#c4c9d2" /><rect x="290" y="680" width="92" height="18" rx="9" fill="#c4c9d2" />

    <!-- A photo card -->
    <g filter="url(#lift)">
      <rect x="590" y="230" width="250" height="250" rx="40" fill="#ffffff" />
    </g>
    <rect x="606" y="246" width="218" height="218" rx="28" fill="url(#photo)" />
    <circle cx="776" cy="302" r="24" fill="#ffe8a3" />
    <path d="M606 418l64-68 50 50 38-34 66 62v8a28 28 0 0 1-28 28H634a28 28 0 0 1-28-28z" fill="#ffffff" opacity="0.88" />

    <!-- A blue folder -->
    <g filter="url(#lift)">
      <path d="M590 600a24 24 0 0 1 24-24h76l32 32h94a24 24 0 0 1 24 24v26H590z" fill="#1f5fd1" />
      <rect x="610" y="616" width="210" height="60" rx="10" fill="#f4f6fb" />
      <rect x="590" y="640" width="250" height="150" rx="30" fill="url(#folderFront)" />
    </g>

    <!-- An arrow from the wall to the folder -->
    <path d="M470 594 C 540 594, 518 712, 570 712" fill="none" stroke="#88c0d0" stroke-width="18" stroke-linecap="round" />
    <path d="M548 688 L576 712 L548 736" fill="none" stroke="#88c0d0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
